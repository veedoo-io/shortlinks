# Production stack for Dokploy: PostgreSQL and Redis only.
#
# The app images (nginx `web` and `php-fpm`) are deployed as separate Dokploy
# Applications, so Dokploy builds them on the build server and pulls them here,
# instead of building them on the production server. They reach PostgreSQL and
# Redis over the private `shortlink-internal` overlay network (created in
# Dokploy, attachable) by the same hostnames as before: `postgres` and `redis`.
# The Applications mount the existing laravel-storage-production and
# laravel-public-assets volumes directly.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    user: postgres
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE:-app}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - postgres-data-production:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - shortlink-internal
    # Health check for PostgreSQL
    # -----------------------------------------------------------
    # Health checks allow Docker to determine if a service is operational.
    # The 'pg_isready' command checks if PostgreSQL is ready to accept connections.
    # This prevents dependent services from starting before the database is ready.
    # -----------------------------------------------------------
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:alpine
    restart: unless-stopped  # Automatically restart unless the service is explicitly stopped
    networks:
      - shortlink-internal
    # Health check for Redis
    # -----------------------------------------------------------
    # Checks if Redis is responding to the 'PING' command.
    # This ensures that the service is not only running but also operational.
    # -----------------------------------------------------------
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  # Shared only by this stack's services and the two Shortlink Applications.
  shortlink-internal:
    external: true

volumes:
  postgres-data-production:
